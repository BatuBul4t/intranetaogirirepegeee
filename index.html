<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aogiri Net 2001</title>
<link rel="stylesheet" href="assets/css/global.css">
<link rel="stylesheet" href="assets/css/browser.css">
<link rel="stylesheet" href="assets/css/chat-admin-secure.css">
</head>
<body>
<div class="desktop">
  <div class="taskbar">
    <button class="start">▣ Iniciar</button>
    <div class="tasklabel">Aogiri Internet Explorer</div>
    <div class="small"><span class="online-dot"></span><b id="onlineCount">0</b> online</div>
    <div id="clock" class="clock">00:00</div>
  </div>
  <div class="window">
    <div class="titlebar">
      <span>Aogiri Internet Explorer - 2001</span>
      <div class="window-controls"><span>_</span><span>□</span><span>×</span></div>
    </div>
    <div class="menubar">Arquivo Editar Exibir Favoritos Ferramentas Ajuda</div>
    <div class="toolbar">
      <button id="backBtn">◀ Voltar</button>
      <button id="forwardBtn">▶ Avançar</button>
      <button id="stopBtn">■ Parar</button>
      <button id="refreshBtn">⟳ Atualizar</button>
      <button id="homeBtn">⌂ Início</button>
      <button id="historyBtn">☷ Histórico</button>
    </div>
    <div class="addressbar">
      <span>Endereço</span>
      <input id="addressInput" value="http://home.aogiri.local/">
      <button id="goBtn">Ir</button>
    </div>
    <div class="browser-shell">
      <aside class="sidebar">
        <h2>AOGIRI NET</h2>
        <p class="small">GATEWAY 04<br>56K MODEM<br>SESSION 2001</p>
        <button class="side-link" data-route="home">Página inicial</button>
        <button class="side-link" data-route="search">Pesquisar</button>
        <button class="side-link" data-route="ccg">Arquivo CCG</button>
        <button class="side-link" data-route="publish">Publicar Artigo</button>
        <button class="side-link" data-route="community">Artigos da Comunidade</button>
        <button class="side-link" data-route="forum">2channel Global</button>
        <button class="side-link" data-route="chat">Chat Temporário</button>
        <button class="side-link" data-route="sites">Sites</button>
        <button class="side-link" data-route="history">Histórico</button>
        <div class="sidebar-box">
          <b>Boards</b>
          <a href="#forum/ccg">CCG</a>
          <a href="#forum/occult">Ocultismo</a>
          <a href="#forum/ward20">Distrito 20</a>
          <a href="#forum/tech">PC / Internet</a>
          <a href="#forum/games">Games</a>
        </div>
      </aside>
      <main id="view" class="view"></main>
    </div>
    <div class="statusbar">
      <span id="statusText">Pronto</span><span>Supabase Realtime</span><span>2001</span>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/data/articles.js"></script>
<script src="assets/js/data/searches.js"></script>
<script src="assets/js/data/boards.js"></script>
<script src="assets/js/search-engine.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/admin-auth.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/chat-admin-secure.js"></script>
</body>
</html>
